<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>锦程 · 个人成长工作台</title>
<style>
:root{
  --accent:#2F4F3E;        /* 墨绿主色 */
  --accent-soft:#3d6350;
  --surface:#F5F1E8;       /* 米纸底 */
  --surface-2:#FBF8F1;
  --card:#FFFFFF;
  --gold:#C9A227;          /* 赭金强调 */
  --ink:#2b2a26;           /* 深字 */
  --ink-2:#6b675d;
  --line:#e4ddcd;          /* 浅描边 */
  --line-2:#efe9da;
  --danger:#b4533a;
  --ok:#3f7d4e;
  --warn:#c98a1e;
  --shadow:0 1px 3px rgba(40,36,28,.08),0 8px 24px rgba(40,36,28,.06);
  --radius:14px;
  --gap:16px;
  --pad:18px;
  --sidebar-w:264px;
}
body[data-color="dai"]{--accent:#274059;--accent-soft:#365a78;}
body[data-color="zhe"]{--accent:#8a5a2b;--accent-soft:#a06e38;}
body[data-color="zi"]{--accent:#5b3a6b;--accent-soft:#744a87;}
body.dark{
  --surface:#222820; --surface-2:#262d24; --card:#2c332a;
  --ink:#ECE7D8; --ink-2:#a8a290; --line:#3a423a; --line-2:#333a32;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
body[data-density="compact"]{--gap:10px;--pad:12px;--radius:11px;}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--surface); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:0;height:0;background:transparent}
*{scrollbar-width:none}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* 图标统一基准尺寸：凡是未显式指定上下文尺寸的图标都按 18px 渲染，
   避免 SVG 无固有尺寸时在卡片标题、顶栏药丸、搜索结果等处被撑得过大（比例失调） */
.ic{width:18px;height:18px;flex:0 0 auto;vertical-align:middle}

/* 布局 */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;transition:grid-template-columns .25s}
.app.collapsed{grid-template-columns:0 1fr}
.sidebar{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sidebar.hide{transform:translateX(-100%);opacity:0;pointer-events:none}
.main{display:flex;flex-direction:column;min-width:0;height:100vh;background:var(--surface)}

/* 品牌 */
.brand{display:flex;align-items:center;gap:10px;padding:16px var(--pad);border-bottom:1px solid var(--line-2)}
.brand .logo{width:34px;height:34px;flex:0 0 auto}
.brand .name{font-size:19px;font-weight:800;letter-spacing:2px}
.brand .name small{display:block;font-size:10px;font-weight:500;letter-spacing:1px;color:var(--ink-2);opacity:.8}

/* 个人资料卡 */
.profile-card{margin:12px var(--pad);padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
.profile-card .pc-top{display:flex;align-items:center;gap:10px}
.profile-card .avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:0 0 auto}
.profile-card .pc-name{font-weight:700;font-size:15px}
.profile-card .pc-motto{font-size:12px;color:var(--ink-2);margin-top:2px}
.profile-card .pc-stats{display:flex;gap:8px;margin-top:12px}
.profile-card .pc-stat{flex:1;text-align:center;background:var(--surface);border-radius:10px;padding:6px 2px}
.profile-card .pc-stat b{display:block;font-size:15px;color:var(--accent)}
.profile-card .pc-stat span{font-size:10px;color:var(--ink-2)}

/* 导航 */
.nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav-group{margin:8px 0}
.nav-group .ng-title{font-size:11px;letter-spacing:1px;color:var(--ink-2);padding:8px 10px 4px;font-weight:700;text-transform:none}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);cursor:pointer;border:1px solid transparent;margin:2px 0;font-size:13.5px;transition:background .15s}
.nav-item:hover{background:var(--surface)}
.nav-item.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-item.active .ni-ico{color:#fff}
.nav-item .ni-ico{width:18px;height:18px;color:var(--accent);flex:0 0 auto}
.nav-item .ni-badge{margin-left:auto;font-size:11px;background:var(--gold);color:#3a2e08;border-radius:20px;padding:1px 7px;font-weight:700}
.nav-item.active .ni-badge{background:rgba(255,255,255,.25);color:#fff}
.side-foot{padding:10px var(--pad);font-size:11px;color:var(--ink-2);border-top:1px solid var(--line-2);line-height:1.5}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .lv-badge{display:flex;align-items:center;gap:8px}
.lv-ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0deg),var(--line) 0);display:flex;align-items:center;justify-content:center;position:relative}
.lv-ring span{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--accent)}
.xpbar{flex:0 0 120px}
.xpbar .xb-track{height:7px;background:var(--line);border-radius:6px;overflow:hidden}
.xpbar .xb-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));width:0}
.xpbar .xb-num{font-size:10px;color:var(--ink-2);margin-top:2px;text-align:center}
.tb-pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-weight:700;font-size:13px}
.tb-pill .pi{width:15px;height:15px;color:var(--accent)}
.tb-pill.coins{color:var(--gold)}
.tb-search{flex:1;min-width:160px;position:relative}
.tb-search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:20px;background:var(--card);outline:none}
.tb-search input:focus{border-color:var(--accent)}
.tb-search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-2)}
.tb-actions{display:flex;gap:6px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.icon-btn:hover{background:var(--surface)}
.icon-btn .ic{width:19px;height:19px}
.icon-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 内容区 */
.detail{flex:1;overflow-y:auto;padding:var(--gap) var(--pad) calc(60px + env(safe-area-inset-bottom))}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:var(--gap);flex-wrap:wrap}
.view-head h1{font-size:22px;margin:0;letter-spacing:1px}
.view-head .sub{font-size:12px;color:var(--ink-2);margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--gap);border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{padding:7px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:hover{color:var(--accent)}

/* 卡片栅格 */
.grid{display:grid;gap:var(--gap)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.cols-3,.cols-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}
/* 设置页：卡片按内容高度，减少纵向空白 */
.settings-grid{align-items:start}
.settings-grid .card{height:auto}
/* 个人收支底栏等高，资产改为纵向两行 */
.finance-row{align-items:stretch}
.asset-rows{display:flex;flex-direction:column;gap:10px}
.asset-rows .field{margin-bottom:0}
/* 个人收支底栏：信用消费 + 现有资产强制两列等高 */
.finance-bottom{display:flex;gap:var(--gap);align-items:stretch;margin-top:16px}
.finance-bottom>.card{flex:1;min-width:0;display:flex;flex-direction:column}
.finance-bottom>.card>h3{flex:0 0 auto}
.finance-bottom>.card>div:last-child{flex:1;display:flex;flex-direction:column}
.finance-bottom .asset-rows{flex:1;justify-content:flex-start}
@media(max-width:760px){.finance-bottom{flex-direction:column}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .ci{width:17px;height:17px;color:var(--accent)}
.card .ch-act{margin-left:auto;display:flex;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--ink-2);font-size:12px}
.tiny{font-size:11px;color:var(--ink-2)}
.right{margin-left:auto}
.center{text-align:center}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{padding:24px;text-align:center;color:var(--ink-2);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.gold>span{background:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.tag.gold{background:rgba(201,162,39,.14);color:var(--gold);border-color:transparent}
.tag.accent{background:rgba(47,79,62,.1);color:var(--accent);border-color:transparent}
.tag .dot{width:8px;height:8px;border-radius:50%}

/* 列表项 */
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:8px}
.item:hover{border-color:var(--accent)}
.item.done{opacity:.6}
.item.done .it-title{text-decoration:line-through}
.it-title{font-weight:600;flex:1;min-width:0}
.it-title small{display:block;font-weight:400;color:var(--ink-2);font-size:11px}
.it-acts{display:flex;gap:4px;flex:0 0 auto}
.mini{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mini:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini.danger{color:var(--danger)}
.mini.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.mini .ic{width:15px;height:15px}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--card)}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chk .ic{width:14px;height:14px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.gold{background:var(--gold);color:#3a2e08;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn .ic{width:15px;height:15px}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.f-row{display:flex;gap:10px}
.f-row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}

/* 弹窗 */
.modal-root{position:fixed;inset:0;background:rgba(20,18,14,.42);display:none;align-items:flex-start;justify-content:center;z-index:900;padding:6vh 16px;overflow-y:auto}
.modal-root.open{display:flex}
#modalBox{background:var(--card);border-radius:18px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);padding:20px 22px;animation:pop .18s ease}
#modalBox.wide{width:min(820px,100%)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h2{margin:0;font-size:18px}
.modal-close{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2)}

/* toast */
.toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:1200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:24px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease;max-width:80vw}
.toast.ok{background:var(--ok)}
.toast.gold{background:var(--gold);color:#3a2e08}
.toast.err{background:var(--danger)}
@keyframes tin{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* 小树苗 */
.sprout{position:fixed;left:30px;bottom:30px;width:74px;height:92px;z-index:800;cursor:grab;touch-action:none;user-select:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));transition:opacity .3s}
.sprout.dragging{cursor:grabbing}
.sprout.hidden{opacity:0;pointer-events:none}
.sprout .leaf{transform-origin:bottom center;animation:sway 3.4s ease-in-out infinite}
.sprout .leaf.l2{animation-delay:.4s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sprout.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.sprout-bubble{position:fixed;z-index:801;max-width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:none;animation:tin .2s ease}
.sprout-bubble::after{content:"";position:absolute;left:22px;bottom:-7px;width:12px;height:12px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}

/* 搜索结果 */
.search-pop{position:absolute;left:0;right:0;top:42px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:340px;overflow-y:auto;z-index:50;display:none}
.search-pop.open{display:block}
.search-pop .sp-item{padding:10px 12px;display:flex;gap:8px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line-2)}
.search-pop .sp-item:hover{background:var(--surface)}
.search-pop .sp-item .sp-ico{width:15px;height:15px;color:var(--accent)}
.search-pop .sp-kind{font-size:10px;color:var(--ink-2);margin-left:auto}

/* 课程表 */
.timetable{width:100%;border-collapse:collapse;font-size:12px}
.timetable th,.timetable td{border:1px solid var(--line);padding:5px;text-align:center;vertical-align:top;height:54px}
.timetable th{background:var(--surface-2);font-weight:600}
.timetable td .course{background:var(--accent);color:#fff;border-radius:8px;padding:4px;cursor:pointer;font-size:11px;line-height:1.3}
.timetable td .course .t{font-weight:700}
.timetable td .course .r{opacity:.85}

/* 书架 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.book{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s}
.book:hover{transform:translateY(-3px);border-color:var(--accent)}
.book .cover{height:150px;background:linear-gradient(135deg,var(--accent),var(--accent-soft));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;text-align:center;padding:8px;position:relative}
.book .cover img{width:100%;height:100%;object-fit:cover}
.book .b-meta{padding:8px 10px}
.book .b-title{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book .b-status{position:absolute;top:6px;right:6px;font-size:9px;padding:2px 6px;border-radius:10px;background:rgba(0,0,0,.45);color:#fff}
.book .b-prog{height:5px;background:var(--line);margin-top:6px;border-radius:4px;overflow:hidden}
.book .b-prog>span{display:block;height:100%;background:var(--gold)}

/* 进度/数值 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px}
.stat b{font-size:20px;color:var(--accent);display:block}
.stat span{font-size:11px;color:var(--ink-2)}

/* 成就墙 */
.ach-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.ach{text-align:center;padding:14px 8px;border:1px solid var(--line);border-radius:13px;background:var(--card);position:relative}
.ach.locked{filter:grayscale(1);opacity:.5}
.ach .a-ico{width:40px;height:40px;margin:0 auto 8px;color:var(--gold)}
.ach .a-name{font-size:12px;font-weight:600}
.ach .a-desc{font-size:10px;color:var(--ink-2);margin-top:3px}
.ach .a-lock{position:absolute;top:8px;right:8px;width:14px;height:14px;color:var(--ink-2)}

/* 表格 */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line-2);padding:8px 6px;text-align:left}
table.tbl th{color:var(--ink-2);font-weight:600;font-size:12px}

/* 媒体缩略 */
.media-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:0 0 auto;border:1px solid var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:11px;padding:10px;text-align:center;color:var(--ink-2);font-size:12px;cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--accent)}

/* 移动端 */
@media(max-width:860px){
  .app{grid-template-columns:0 1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:600;transition:transform .25s}
  .app:not(.collapsed) .sidebar{transform:translateX(0)}
  .app.collapsed .sidebar{transform:translateX(-105%)}
  .topbar .lv-badge .xpbar{display:none}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:550}
.app:not(.collapsed) .scrim.show{display:block}

/* AI 助手 */
.ai-wrap{display:flex;flex-direction:column;gap:12px}
.ai-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-2);padding-bottom:8px}
.ai-quick{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.ai-log{display:flex;flex-direction:column;gap:10px;max-height:48vh;overflow:auto;padding:4px 2px}
.ai-msg{display:flex;flex-direction:column;gap:3px;max-width:92%}
.ai-msg.user{align-self:flex-end;align-items:flex-end}
.ai-msg.assistant{align-self:flex-start}
.ai-role{font-size:11px;color:var(--ink-2)}
.ai-bubble{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;line-height:1.6;font-size:13px}

function mergeDeep(target, src) {
  if (Array.isArray(src)) return deepClone(src);

function compressImage(src, max, cb) {
  try {
    const im = new Image();
    im.onload = () => { let w = im.width, h = im.height; if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); } const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h); cb(c.toDataURL('image/jpeg', 0.82)); };
    im.onerror = () => cb(src);
    im.src = src;
  } catch (e2) { cb(src); }
}

/* ---------- 迁移 + 深合并 ---------- */
function migrate(s) {
  s = mergeDeep(DEFAULT_STATE(), s || {});
  s.version = 2;
  if (!Array.isArray(s.inspiration.categories) || !s.inspiration.categories.length)
    s.inspiration.categories = DEFAULT_STATE().inspiration.categories;
  if (!Array.isArray(s.reading.categories) || !s.reading.categories.length)
    s.reading.categories = DEFAULT_STATE().reading.categories;
  if (!s.courses || !s.courses.periods) s.courses = DEFAULT_STATE().courses;
  if (!s.finance || !s.finance.assets) s.finance = DEFAULT_STATE().finance;
  if (!s.research || !s.research.design) s.research = mergeDeep(DEFAULT_STATE().research, s.research);
  if (!s.rewardPool) s.rewardPool = DEFAULT_STATE().rewardPool;
  if (!s.rewards) s.rewards = DEFAULT_STATE().rewards;
  if (typeof s.settings.aiWeb !== 'boolean') s.settings.aiWeb = false;
  if (typeof s.settings.searchApi !== 'string') s.settings.searchApi = '';
  if (!s.achievements) s.achievements = [];
  if (!s.activeDays) s.activeDays = [];
  if (!s.log) s.log = [];
  return s;
}

      if (r.ok) { const j = await r.json(); return migrate(j && j.data ? j.data : j); }
    }
  } catch (e) { /* 回退本地 */ }
  try {

    if (raw) return migrate(JSON.parse(raw));
  } catch (e) {}
  return SEEDED_STATE();
}

async function save() {
  S.log = (S.log || []).slice(-200);
  S.log.push({ t: dtLocal(), m: 'save' });
  try {
    if (USE_API) {
      await fetch(API + '/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ version: 2, data: S }) });
      return;
    }
  } catch (e) { toast('API 保存失败，已回退本地', 'err'); }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('本地存储失败', 'err'); }
}

/* 媒体：POST base64 到 /api/media，返回 url；否则返回 dataURL 直接内联 */
async function saveMedia(dataUrl, kind) {
  const ext = (dataUrl.match(/data:image\/(\w+)/) || dataUrl.match(/data:video\/(\w+)/) || [])[1] || 'png';
  try {
    if (USE_API) {
      const r = await fetch(API + '/api/media', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: dataUrl, kind: kind || 'img', ext }) });
      if (r.ok) { const j = await r.json(); if (j.url) return j.url; }
    }
  } catch (e) {}
  return dataUrl; // 离线直接内联
}

/* ---------- 游戏化三件套 ---------- */
const levelReq = (lv) => 80 + (lv - 1) * 60;          // 升到下一等级所需 XP
const levelProgress = () => { const need = levelReq(S.profile.level); return clamp(S.profile.xp / need, 0, 1); };

function addXP(n) {
  n = Math.round(Number(n) || 0); if (!n) return;
  S.profile.xp += n;
  let leveled = false;
  while (S.profile.xp >= levelReq(S.profile.level)) {
    S.profile.xp -= levelReq(S.profile.level);
    S.profile.level += 1; leveled = true;
  }
  if (leveled) { toast('🌟 升级！当前 LV' + S.profile.level, 'gold'); sproutSay(pick(DIALOGS.levelUp)()); }
  save(); renderTop(); renderProfile(); checkAch();
}
function addCoins(n) {
  n = Math.round(Number(n) || 0); if (!n) return;
  S.profile.coins += n;
  save(); renderTop(); renderProfile();
}
function checkAch() {
  const defs = ACH_DEFS();
  defs.forEach(d => {
    if (S.achUnlocked[d.id]) return;
    let ok = false; try { ok = d.test(); } catch (e) { ok = false; }
    if (ok) {
      S.achUnlocked[d.id] = { at: today(), name: d.name };
      toast('🏅 解锁成就：' + d.name, 'gold');
      if (d.bonus) { if (d.bonus.xp) addXP(d.bonus.xp); if (d.bonus.coins) addCoins(d.bonus.coins); }
    }
  });
  save(); renderProfile();
}

/* ---------- 小树苗说话 + 朗读 ---------- */
let SPR = null;
function sproutSay(text) {
  SPR = SPR || $('#sprout');
  if (!SPR || SPR.classList.contains('hidden')) return; // 仅在可见时出声
  let b = $('#sproutBubble');
  if (!b) { b = document.createElement('div'); b.id = 'sproutBubble'; b.className = 'sprout-bubble'; document.body.appendChild(b); }
  b.textContent = text; b.style.display = 'block';
  const r = SPR.getBoundingClientRect();
  b.style.left = Math.max(8, r.left - 6) + 'px';
  b.style.top = (r.top - b.offsetHeight - 14) + 'px';
  clearTimeout(SPR._t);
  SPR._t = setTimeout(() => { b.style.display = 'none'; }, 3600);
  if (S.settings.sound && 'speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(text.replace(/[✦🌟🏅✓]/g, ''));
      u.lang = 'zh-CN'; u.rate = 1.02; speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }
}
function speak(text) { sproutSay(text); }

/* ---------- 小树苗拖动 ---------- */
function attachSprout() {
  const spr = $('#sprout');
  const pos = (() => { try { return JSON.parse(localStorage.getItem('sprout_pos') || 'null'); } catch (e) { return null; } })();
  if (pos) { spr.style.left = pos.x + 'px'; spr.style.top = pos.y + 'px'; spr.style.bottom = 'auto'; }
  let sx = 0, sy = 0, moved = false, dragging = false;
  spr.addEventListener('pointerdown', (e) => {
    e.preventDefault(); sx = e.clientX; sy = e.clientY; moved = false; dragging = true;
    spr.setPointerCapture(e.pointerId);
  });
  spr.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) > 4) { moved = true; spr.classList.add('dragging'); spr.style.bottom = 'auto'; }
    if (moved) {
      const w = spr.offsetWidth, h = spr.offsetHeight;
      let x = clamp(e.clientX - w / 2, 4, window.innerWidth - w - 4);
      let y = clamp(e.clientY - h / 2, 4, window.innerHeight - h - 4);
      spr.style.left = x + 'px'; spr.style.top = y + 'px';
    }
  });
  const end = (e) => {
    if (!dragging) return; dragging = false; spr.classList.remove('dragging');
    if (moved) {
      const r = spr.getBoundingClientRect();
      localStorage.setItem('sprout_pos', JSON.stringify({ x: r.left, y: r.top }));
    } else {
      spr.classList.add('shake');
      setTimeout(() => spr.classList.remove('shake'), 520);
      sproutSay(pick(SPROUT_MOTIVATION));
    }
  };
  spr.addEventListener('pointerup', end);
  spr.addEventListener('pointercancel', end);
}

/* ---------- 全局搜索索引 ---------- */
function buildSearchIndex() {
  const idx = [];
  const push = (kind, title, sub, view, id) => idx.push({ kind, title: String(title || ''), sub: String(sub || ''), view, id: id || '' });
  (S.research.papers || []).forEach(p => push('文献', p.title, (p.author || '') + ' · ' + (p.venue || ''), 'research', p.id));
  (S.inspiration.items || []).forEach(i => push('灵感', i.text, (i.catName || '') + ' · ' + fmtDate(i.at), 'inspiration', i.id));
  (S.todos || []).forEach(t => push('待办', t.title, (t.cat || '') + (t.due ? ' · ' + t.due : ''), 'time', t.id));
  (S.reading.books || []).forEach(b => push('书目', b.title, (b.author || '') + ' · ' + (b.status || ''), 'reading', b.id));
  (S.reading.notes || []).forEach(n => push('笔记', (n.text || '').slice(0, 40), (n.bookName || '') + ' · ' + (n.type || ''), 'reading', n.id));
  (S.studyPlans || []).forEach(p => push('学习目标', p.title, p.desc || '', 'study', p.id));
  (S.research.tasks || []).forEach(t => push('科研任务', t.title, t.note || '', 'research', t.id));
  (S.workouts || []).forEach(w => push('训练', (w.type || '训练'), (w.date || ''), 'sport', w.id));
  (S.finance.transactions || []).forEach(t => push('收支', t.note || t.cat, (t.kind || '') + ' ' + money(t.amount), 'finance', t.id));
  (S.rewards.list || []).forEach(r => push('奖励', r.name, r.desc || '', 'rewards', r.id));
  VIEWS.forEach(v => push('模块', v.name, '进入「' + v.name + '」', v.id, ''));
  return idx;
}

  const pop = $('#searchPop'); if (!pop) return;

    `<div class="sp-item" data-search-view="${r.view}" data-search-id="${r.id}">${ico(r.kind === '模块' ? 'target' : 'search', 'sp-ico')}<div><div>${esc(r.title)}</div><div class="tiny">${esc(r.sub)}</div></div><span class="sp-kind">${r.kind}</span></div>`

const NEWS_TABS = ['academic', 'tech', 'finance', 'society', 'world', 'life'];
function newsUrl(title, source) { return 'https://www.baidu.com/s?wd=' + encodeURIComponent((title || '') + ' ' + (source || '')); }
function newsThumb(tab) {
  const c = { academic:'#3b6ea5', tech:'#4f8a55', finance:'#b8862f', society:'#9a5fb0', world:'#4a7d8c', life:'#c2622f' }[tab] || '#667';
  const t = { academic:'学术前沿', tech:'科技', finance:'财经', society:'社会', world:'国际', life:'生活' }[tab] || '热点';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="130"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c+'"/><stop offset="1" stop-color="'+c+'99"/></linearGradient></defs><rect width="320" height="130" fill="url(#g)"/><text x="16" y="78" font-family="sans-serif" font-size="26" fill="#fff" font-weight="700">'+t+'</text><text x="16" y="104" font-family="sans-serif" font-size="14" fill="#ffffffcc">实时热点 · 本地配图</text></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function judgeSuitability(src) {
  if (!src) return { level: '本地', cls: 'accent' };
  try {
    const u = src.toLowerCase();
    if (u.indexOf('data:') === 0) return { level: '本地', cls: 'accent' };
    if (u.indexOf('https://') !== 0) return { level: '低', cls: 'low' };
    const bad = ['doubleclick','adservice','googlesyndication','adnxs','pubmatic','criteo','pixel','tracking'];
    if (bad.some(d => u.indexOf(d) >= 0)) return { level: '低', cls: 'low' };
    const ok = ['.jpg','.jpeg','.png','.webp','.gif'];
    if (ok.some(e => u.indexOf(e) >= 0) || u.indexOf('image') >= 0) return { level: '高', cls: 'ok' };
    return { level: '中', cls: 'warn' };
  } catch (e2) { return { level: '中', cls: 'warn' }; }
}
function newsPoolPick(tab, n) {
  const pool = (NEWS_POOL[tab] || []).slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  return pool.slice(0, n);
}
function seedNews() {
  const keep = (S.news.saved || []).filter(n => n.saved);
  const fresh = [];
  NEWS_TABS.forEach(tab => newsPoolPick(tab, 10).forEach(([title, summary, source]) => fresh.push({ id: uid(), tab, title, summary, source, url: newsUrl(title, source), image: '', at: now(), saved: false })));
  S.news.saved = keep.concat(fresh);
  S.news.updated = Date.now();
}

/* ===================== 通用集合机件 ===================== */
function collArr(coll) {
  switch (coll) {
    case 'timeBlocks': return S.timeBlocks;
    case 'todos': return S.todos;
    case 'studyPlans': return S.studyPlans;
    case 'coursesHomework': return S.courses.homework;
    case 'workouts': return S.workouts;
    case 'researchPapers': return S.research.papers;
    case 'researchIdeas': return S.research.ideas;
    case 'researchTasks': return S.research.tasks;
    case 'researchMilestones': return S.research.milestones;
    case 'researchRisks': return S.research.risks;
    case 'researchMaterials': return S.research.materials;
    case 'researchManuscripts': return S.research.manuscripts;
    case 'inspItems': return S.inspiration.items;
    case 'inspCats': return S.inspiration.categories;
    case 'readingBooks': return S.reading.books;
    case 'readingNotes': return S.reading.notes;
    case 'readingCats': return S.reading.categories;
    case 'financeTx': return S.finance.transactions;
    case 'financeBudgets': return S.finance.budgets;
    case 'financeGoals': return S.finance.goals;
    case 'financeBig': return S.finance.big;
    case 'financeCredits': return S.finance.credits;
    case 'financeSalary': return S.finance.assets.salary;
    case 'rewardsList': return S.rewards.list;
    case 'rewardsHistory': return S.rewards.history;
    case 'rewardPoolHistory': return S.rewardPool.history;
    case 'newsSaved': return S.news.saved;
    case 'reviewsDaily': return S.reviews.daily;
    case 'reviewsWeekly': return S.reviews.weekly;
    case 'reviewsMonthly': return S.reviews.monthly;
    case 'achievements': return S.achievements;
    case 'activeDays': return S.activeDays;
    case 'log': return S.log;
    default: return null;
  }
}
function upsert(coll, id, obj) {
  const arr = collArr(coll); if (!arr) return;
  if (id) { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = Object.assign({}, arr[i], obj); else arr.push(obj); }
  else arr.push(obj);
  save(); render(); checkAch();
}
function delColl(coll, id) {
  const arr = collArr(coll); if (!arr) return;
  if (coll === 'readingCats') {
    if (id === 'r_def') { toast('默认分类不可删除', 'err'); return; }
    (S.reading.books || []).forEach(b => { if (b.cat === id) b.cat = 'r_def'; });
    (S.reading.notes || []).forEach(n => { if (n.cat === id) n.cat = 'r_def'; });
  }
  if (coll === 'inspCats') {
    if (id === 'c_def') { toast('默认分类不可删除', 'err'); return; }
    (S.inspiration.items || []).forEach(i => { if (i.cat === id) i.cat = 'c_def'; });
  }
  if (coll === 'workouts') {
    const item = arr.find(x => x.id === id);
    if (item) {
      const rwcfg = S.settings.rewards || {};
      const wcoin = item.coin != null ? item.coin : (rwcfg.workout != null ? rwcfg.workout : 20);
      if (wcoin) addCoins(-wcoin);
      if (item.activeDay && !(S.workouts || []).some(w => w.id !== id && w.activeDay === item.activeDay)) {
        S.activeDays = (S.activeDays || []).filter(d => d !== item.activeDay);
      }
    }
  }
  const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1);
  save(); render(); toast('已删除', 'ok'); sproutSay(sproutOp('del'));
}
function moveItem(arr, id, dir) {
  const i = arr.findIndex(x => x.id === id); if (i < 0) return;
  const j = i + dir; if (j < 0 || j >= arr.length) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}
function toggleDone(coll, id) {
  const awardToggle = (on, amt) => { if (amt > 0) { if (on) addCoins(amt); else addCoins(-amt); } };
  if (coll === 'studyStep') {
    const [pid, sid] = id.split(':');
    const plan = (S.studyPlans || []).find(p => p.id === pid);
    if (plan && plan.steps) { const st = plan.steps.find(s => s.id === sid); if (st) { const was = st.done; st.done = !st.done; plan.done = plan.steps.length > 0 && plan.steps.every(s => s.done); const cfg = S.settings.rewards || {}; awardToggle(st.done, cfg.studyStep != null ? cfg.studyStep : 10); save(); render(); checkAch(); } }
    return;
  }
  const arr = collArr(coll); if (!arr) return;
  const it = arr.find(x => x.id === id); if (!it) return;
  const was = it.done;
  it.done = !it.done;
  if (coll === 'coursesHomework' && it.done) {
    const exist = (S.todos || []).find(t => t.srcHw === id);
    if (!exist) S.todos.push({ id: uid(), title: it.title, cat: '课程作业', due: it.due || '', remind: '', done: true, srcHw: id });
  }
  if ((coll === 'timeBlocks' || (coll === 'todos' && !it.srcHw)) && was !== it.done) {
    const cfg = S.settings.rewards || {};
    const amt = coll === 'timeBlocks' ? (cfg.timeBlock != null ? cfg.timeBlock : 10) : (cfg.todo != null ? cfg.todo : 10);
    awardToggle(it.done, amt);
  }
  sproutSay(sproutOp('done')); save(); render(); checkAch();
}

function buildForm(coll, item) {

function readFile(input) {
  return new Promise((res) => {
    if (!input || !input.files || !input.files[0]) return res(null);
    const fr = new FileReader();
    fr.onload = () => res(fr.result); fr.onerror = () => res(null);
    fr.readAsDataURL(input.files[0]);
  });
}

    const tab = act.split(':')[1];

    S.reviews = S.reviews || {};

    arr.push(Object.assign({ id: uid(), date: g('rv_date'), title: g('rv_title') }, extra));

    const bonus = tab === 'daily' ? (rwcfg.daily != null ? rwcfg.daily : 15) : tab === 'weekly' ? (rwcfg.weekly != null ? rwcfg.weekly : 30) : (rwcfg.monthly != null ? rwcfg.monthly : 50);

  }

    const acc = getAccounts();

      if (!name.trim()) { delete S.courses.grid[cell]; } else { S.courses.grid[cell] = { name, teacher: v('f_teacher'), room: v('f_room'), time: v('f_time'), note: v('f_note') }; }
      save(); render(); closeModal(); toast('已保存', 'ok'); return;
    } else if (act === 'hw') {
      obj = { id, title: v('f_title'), course: v('f_course'), due: v('f_due'), done: (item && item.done) || false };
    } else if (act === 'bib') {
      parseBib(v('f_bib')); save(); render(); closeModal(); toast('已导入文献', 'ok'); return;

      toast('未知表单：' + act, 'err'); return;
    }
  } catch (err) { toast('保存出错：' + err.message, 'err'); console.error(err); return; }

  if (!obj) { toast('表单解析失败', 'err'); return; }
  /* 根据 act 找到对应集合并写入 */

    timeBlocks: 'timeBlocks', todos: 'todos', studyPlans: 'studyPlans', workouts: 'workouts',
    researchPapers: 'researchPapers', researchTasks: 'researchTasks', researchMilestones: 'researchMilestones',
    researchRisks: 'researchRisks', researchMaterials: 'researchMaterials', researchManuscripts: 'researchManuscripts',
    inspItems: 'inspItems', inspCats: 'inspCats', readingBooks: 'readingBooks', readingNotes: 'readingNotes',

    financeCredits: 'financeCredits', financeSalary: 'financeSalary', rewardsList: 'rewardsList', achievements: 'achievements', hw: 'coursesHomework'
  };
  const coll = collMap[act];
  if (!coll) { toast('未登记集合', 'err'); return; }
  if (coll === 'coursesHomework') { // 作业：每月编辑计数不在此限制
    upsert(coll, id, obj);
  } else if (coll === 'rewardsList') {
    const edits = S.rewards.edits || 0;
    if (!id && edits >= 3) { toast('本月奖励编辑次数已用完', 'err'); return; }
    if (!id) S.rewards.edits = edits + 1;
    upsert(coll, id, obj); checkAch();
  } else if (coll === 'workouts') {
    const rw = S.settings.rewards || {};
    const wcoin = rw.workout != null ? rw.workout : 20;
    obj.coin = wcoin;
    obj.activeDay = today();
    upsert(coll, id, obj);
    if (!isEdit) { addCoins(wcoin); addXP(15); markActiveDay(today()); }
  } else {
    upsert(coll, id, obj);
  }
  closeModal(); toast(dialog('saved'), 'ok'); sproutSay(sproutOp('save'));
}
function parseBib(text) {
  const entries = text.split('@').slice(1);
  entries.forEach(e => {
    const get = (f) => { const m = e.match(new RegExp(f + '\\s*=\\s*[{"]([^}"]*)["}]', 'i')); return m ? m[1].replace(/[{}]/g, '').trim() : ''; };
    const title = get('title'); if (!title) return;
    S.research.papers.push({ id: uid(), title, author: get('author'), year: get('year'), status: '想读', venue: get('journal') || get('booktitle') || '', rating: 0, progress: 0, cited: false, tags: [], notes: '', attachment: '' });
  });
}

/* ===================== 专注计时器 ===================== */
let focusTimer = null, focusRemain = 0;
function tickFocus() {
  const m = Math.floor(focusRemain / 60), s = focusRemain % 60;
  const el = $('#focusTime'); if (el) el.textContent = pad2(m) + ':' + pad2(s);
  if (focusRemain <= 0) {
    clearInterval(focusTimer); focusTimer = null;
    const xp = S.settings.focusDuration >= 25 ? 15 : 10;
    const rwcfg = S.settings.rewards || {};
    addXP(xp); addCoins(rwcfg.focus != null ? rwcfg.focus : 5); markActiveDay(today());
    toast('专注完成！+' + xp + ' XP', 'gold'); sproutSay(pick(DIALOGS.focusDone)());
  } else focusRemain--;
}
function startFocus() {
  if (focusTimer) return;
  if (focusRemain <= 0) focusRemain = (S.settings.focusDuration || 25) * 60;
  focusTimer = setInterval(tickFocus, 1000);
}
function pauseFocus() { clearInterval(focusTimer); focusTimer = null; }
function resetFocus() { pauseFocus(); focusRemain = (S.settings.focusDuration || 25) * 60; const el = $('#focusTime'); if (el) el.textContent = pad2(S.settings.focusDuration || 25) + ':00'; }

/* ===================== 签到 / 活跃日 ===================== */
function doCheckin() {
  const t = today();
  if (S.profile.lastCheckin === t) { toast('今天已经签到啦～', 'gold'); return; }
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.profile.streak = (S.profile.lastCheckin === y) ? S.profile.streak + 1 : 1;
  S.profile.longestStreak = Math.max(S.profile.longestStreak, S.profile.streak);
  S.profile.lastCheckin = t;
  const rwcfg = S.settings.rewards || {};
  addCoins(rwcfg.checkin != null ? rwcfg.checkin : 5); addXP(5); markActiveDay(t);
  save(); render();
  toast(dialog('checkin'), 'gold'); sproutSay(dialog('checkinStreak', S.profile.streak));
}

async function ghCall(method, apiPath, body) {
  const g = S.settings.gh || {};
  if (!g.user || !g.repo || !g.token) { toast('请先在「GitHub 同步」面板填写用户名 / 仓库 / Token', 'err'); return null; }
  const headers = { 'Authorization': 'Bearer ' + g.token, 'Accept': 'application/vnd.github+json' };
  try {
    const res = await fetch('https://api.github.com' + apiPath, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (!res.ok) { const t = await res.text().catch(() => ''); toast('GitHub ' + res.status + '：' + t.slice(0, 90), 'err'); return null; }
    if (res.status === 204) return {};
    return await res.json();
  } catch (e) { toast('网络错误：' + e.message, 'err'); return null; }
}
// GitHub Contents API 的路径规则：段内编码、段间 / 不编码
function ghPathUrl() {
  const g = S.settings.gh || {};
  const u = encodeURIComponent(g.user || '');
  const r = encodeURIComponent(g.repo || '');
  const p = (g.path || 'backup/jincheng-backup.json').split('/').map(encodeURIComponent).join('/');
  return '/repos/' + u + '/' + r + '/contents/' + p;
}
async function ghPush() {
  const g = S.settings.gh || {};
  const apiPath = ghPathUrl();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify({ version: 2, data: S }))));
  const existing = await ghCall('GET', apiPath);
  const body = { message: 'sync ' + new Date().toISOString(), content };
  if (existing && existing.sha) body.sha = existing.sha;
  const r = await ghCall('PUT', apiPath, body);
  if (r) toast('已上传备份到 GitHub ✔', 'ok');
}
async function ghPull() {
  const g = S.settings.gh || {};
  const apiPath = ghPathUrl();
  const r = await ghCall('GET', apiPath);
  if (r === null) return;
  if (!r.content) { toast('该仓库路径还没有备份文件，请先上传一次', 'err'); return; }
  try {
    const txt = decodeURIComponent(escape(atob(r.content.replace(/\n/g, ''))));
    const obj = JSON.parse(txt);
    if (obj && obj.data) { S = obj.data; save(); render(); toast('已从 GitHub 拉取并恢复 ✔', 'ok'); }
  } catch (e) { toast('恢复失败：' + e.message, 'err'); }
}
function exportAccounts() {

/* 语音输入：浏览器原生 Web Speech API（Chrome / Edge 桌面版最佳），开启后持续聆听，
   实时把识别结果写入输入框；再次点击停止。无需配置、免费。 */
function voiceToggle() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const inp = $('#aiInput');
  if (!SR) { toast('当前浏览器不支持语音输入，建议用 Chrome / Edge 桌面版', 'err'); return; }
  if (!window.isSecureContext) { toast('语音输入需要 HTTPS 或 localhost 安全环境，请用线上链接打开', 'err'); return; }
  if (voiceOn) { try { voiceRec && voiceRec.stop(); } catch (e) {} voiceOn = false; render(); return; }
  try {
    voiceRec = new SR();
    voiceRec.lang = 'zh-CN';
    voiceRec.interimResults = true;
    voiceRec.continuous = true;
    voiceRec.maxAlternatives = 1;
    const committed = () => (inp ? inp.value : '');
    voiceRec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const tr = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += tr; else interim += tr;
      }
      if (inp) inp.value = committed() + (committed() && final ? ' ' : '') + final + (interim ? (final ? ' ' : '') + interim : '');
    };
    voiceRec.onerror = (e) => {
      let msg = '语音识别出错，请重试';
      if ((e && e.error === 'not-allowed') || (e && e.error === 'service-not-allowed')) msg = '麦克风权限被拒绝，请在浏览器地址栏允许后重试';
      else if (e && e.error === 'no-speech') msg = '没听到声音，请再说一次';
      else if (e && e.error === 'network') msg = '语音服务联网失败，请检查网络或用文字输入';
      toast(msg, 'err'); voiceOn = false; render();
    };
    voiceRec.onend = () => { if (voiceOn) { try { voiceRec.start(); } catch (e2) {} } else { render(); } };
    voiceRec.start();
    voiceOn = true; render();
    toast('正在聆听，再次点击停止', 'ok');
  } catch (e) { toast('无法启动语音输入：' + ((e && e.message) || e), 'err'); }
}

/* 真实联网搜索资料：默认用维基百科开放搜索 API（无需 Key、支持 CORS），
   也可在「设置·联网与 AI」填写自定义搜索接口（期望返回 {items:[{title,url,snippet}]}） */
async function webSearch(q, n) {
  n = n || 5;
  const raw = (S.settings && S.settings.searchApi) ? S.settings.searchApi.trim() : '';
  const lang = (S.settings && S.settings.searchLang) || 'zh';
  let url, parse;
  const isWiki = !raw || /wikipedia|w\/api\.php/.test(raw);
  if (isWiki) {
    const base = raw || ('https://' + lang + '.wikipedia.org/w/api.php');
    url = base + (base.indexOf('?') >= 0 ? '&' : '?') + 'action=query&list=search&srsearch=' + encodeURIComponent(q) + '&srlimit=' + n + '&format=json&origin=*';
    parse = (j) => {
      const rows = (j && j.query && j.query.search) || [];
      return rows.map(x => ({
        title: x.title,
        url: 'https://' + lang + '.wikipedia.org/wiki/' + encodeURIComponent(String(x.title || '').replace(/ /g, '_')),
        snippet: String(x.snippet || '').replace(/<[^>]+>/g, '')
      }));
    };
  } else {
    url = raw + (raw.indexOf('?') >= 0 ? '&' : '?') + 'q=' + encodeURIComponent(q) + '&n=' + n;
    parse = (j) => {
      const arr = Array.isArray(j) ? j : (j.items || j.results || j.data || []);
      return (Array.isArray(arr) ? arr : []).map(x => ({ title: x.title || x.name || '资料', url: x.url || x.link || '', snippet: x.snippet || x.desc || x.summary || '' }));
    };
  }
  try {
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return [];
    const j = await r.json();
    const out = parse(j).filter(x => x.url || x.title);
    return out.slice(0, n);
  } catch (e) { return []; }
}

async function askAI(prompt, sources, image) {
  sources = sources || [];
  const R = S.research, st = S.settings;
  const now = new Date();
  const nowStr = now.toLocaleString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai' });
  const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
  const weekCn = '星期' + weekDays[now.getDay()];
  const ctx = '用户数据摘要：待办' + ((S.todos || []).filter(t => !t.done).length) + ' 条，文献' + (R.papers || []).length + ' 篇，灵感' + (S.inspiration.items || []).length + ' 条，书目' + (S.reading.books || []).length + ' 本，活跃' + (S.activeDays || []).length + ' 天。\n当前真实时间：' + nowStr + '（' + weekCn + '，北京时间）。当用户问"今天几号/星期几/几月几日"等日期时，请直接用上面这个时间回答，不要用训练数据中的日期。';
  const webCtx = sources.length ? ('\n\n用户已开启联网搜索，以下是为你检索到的真实资料，请在回答中引用并标注来源链接：\n' + sources.map((s, i) => (i + 1) + '. ' + s.title + (s.url ? ' — ' + s.url : '') + (s.snippet ? '\n   ' + s.snippet : '')).join('\n')) : '';
  const ai = st.ai || {};
  const aiProv = ai.provider || 'openai';
  let lastErr = '';
  if (USE_API && ((aiProv === 'openai' && ai.api) || (aiProv === 'gemini' && ai.key))) {
    try {
      const sys = '你是「锦程」个人成长工作台的 AI 助手，语气亲切、简洁、实用。' + ctx + (webCtx ? '\n用户开启了联网搜索，请基于检索到的资料作答，并给出可点击的来源链接。' : '') + (image ? '\n用户上传了图片，请结合图片内容作答。' : '');
      const textPart = prompt + (webCtx ? '\n\n（附检索资料）\n' + webCtx : '');
      if (aiProv === 'gemini') {
        const model = ai.model || 'gemini-2.0-flash';
        const gurl = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(ai.key);
        const parts = [{ text: textPart || '请识别这张图片并回答我的问题。' }];
        if (image) { const mm = String(image).match(/^data:([^;]+);base64,(.*)$/); if (mm) parts.push({ inline_data: { mime_type: mm[1], data: mm[2] } }); }
        const gbody = { systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: parts }], generationConfig: { temperature: 0.7, maxOutputTokens: 2048 } };
        const r = await fetch((ai.cors ? ai.cors + encodeURIComponent(gurl) : gurl), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(gbody) });
        if (r.ok) {
          const j = await r.json();
          const cand = j.candidates && j.candidates[0];
          const txt = cand && cand.content && cand.content.parts ? cand.content.parts.map(function(p){ return p.text || ''; }).join('') : '';
          if (txt) return txt;
          if (j.promptFeedback && j.promptFeedback.blockReason) return '（内容被 Gemini 安全策略拦截：' + j.promptFeedback.blockReason + '）';
          lastErr = 'Gemini 返回 ' + r.status + '：' + (j.error && j.error.message ? j.error.message : JSON.stringify(j).slice(0, 200));
        } else {
          let body = ''; try { body = (await r.text()).slice(0, 200); } catch (e) {}
          lastErr = 'Gemini HTTP ' + r.status + '：' + (body || r.statusText || '空响应');
        }
      } else {
        const userContent = image
          ? [{ type: 'text', text: textPart || '请识别这张图片并回答我的问题。' }, { type: 'image_url', image_url: { url: image } }]
          : textPart;
        const r = await fetch((ai.cors ? ai.cors + encodeURIComponent(ai.api) : ai.api), {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, ai.key ? { 'Authorization': 'Bearer ' + ai.key } : {}),
          body: JSON.stringify({ model: ai.model || 'deepseek-chat', messages: [{ role: 'system', content: sys }, { role: 'user', content: userContent }] })
        });
        if (r.ok) {
          const j = await r.json();
          const ans = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || j.reply || j.content || '';
          if (ans) return ans;
          lastErr = 'OpenAI 兼容接口返回 ' + r.status + '，但无内容字段：' + JSON.stringify(j).slice(0, 200);
        } else {
          let body = ''; try { body = (await r.text()).slice(0, 200); } catch (e) {}
          lastErr = 'OpenAI 兼容接口 HTTP ' + r.status + '：' + (body || r.statusText || '空响应');
        }
      }
    } catch (e) {
      lastErr = (e && (e.message || e.toString())) || '未知错误（fetch 失败，可能是网络/CORS/接口地址错误）';
    }
  }
  return aiLocal(prompt, sources, image, lastErr, aiProv);
}

/* ===================== 初始化与事件装配 ===================== */
function monthlyResetIfNeeded() {
  const m = today().slice(0, 7);
  if (S._month !== m) {
    S._month = m;
    S.rewards.edits = 0;
    S.rewardPool.tickets = 3;
    save();
  }
}

function boot() {
  monthlyResetIfNeeded();
  applyTheme();
  renderProfile();
  renderNav();
  renderTop();
  renderDetail();
  attachSprout();
  bindToggle();
  maybeAutoCapture();
  setInterval(() => { if (document.visibilityState !== 'hidden') maybeAutoCapture(); }, 5 * 60 * 1000);
  if (localStorage.getItem('sprout_hidden') === '1') $('#sprout').classList.add('hidden');
  $('#scrim').addEventListener('click', () => $('#app').classList.add('collapsed'));


  sproutSay(pick(DIALOGS.welcome)());
}

/* 全局事件委托（只绑一次，登录前即可响应登录按钮） */
function globalClick(e){ if(e.target.id==='modalRoot'){closeModal();return;} var sp=e.target.closest('[data-search-view]'); if(sp){navigateTo(sp.getAttribute('data-search-view'),sp.getAttribute('data-search-id'));return;} var fBtn=e.target.closest('[data-form]'); if(fBtn){handleForm(fBtn);return;} var aBtn=e.target.closest('[data-action]'); if(aBtn){handleAction(aBtn.getAttribute('data-action'),aBtn,e);return;} if(!e.target.closest('.tb-search')) closeSearch(); }
function globalInput(e){ if(e.target&&e.target.id==='searchInput') renderSearch(e.target.value); }
function globalChange(e){ if(e.target&&e.target.id==='importFile'&&e.target.files&&e.target.files[0]) importJsonFile(e.target.files[0]); if(e.target&&e.target.id==='aiPhotoFile'&&e.target.files&&e.target.files[0]){ var f=e.target.files[0]; var rd=new FileReader(); rd.onload=function(ev){ compressImage(ev.target.result,800,function(d){ AI_PHOTO=d; render(); }); }; rd.readAsDataURL(f); } }
function globalKey(e){ if(e.key==='Escape'){closeModal();closeSearch();} else if(e.target&&e.target.id==='aiInput'&&e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); handleAction('aiSend',e.target,e); } }
document.addEventListener('click', globalClick);
document.addEventListener('input', globalInput);
document.addEventListener('change', globalChange);
document.addEventListener('keydown', globalKey);

/* 启动 */
function startApp(){ var u=currentUser(); if(u){ boot(); if(u.role==='admin') renderAdminView(); } else { showLogin(); } }
loadData().then(function(d){ S=d; initAccounts(); startApp(); }).catch(function(err){ console.error('加载失败，使用默认数据', err); S=DEFAULT_STATE(); initAccounts(); startApp(); });

})();
</script>
